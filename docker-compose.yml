services:
  app:
    image: node:22-alpine
    container_name: elias_autobus_app
    working_dir: /app
    volumes:
      - '.:/app'
      # overlay Linux-nativo: node_modules fuera del bind 9P de /mnt/c
      - 'elias_node_modules:/app/node_modules'
    ports:
      - '5180:5180'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    # named volume vacío en primer arranque: usar binario marcador, no `test -d`
    command: sh -c "[ -x node_modules/.bin/vite ] || npm install; npm run dev"
    restart: unless-stopped

volumes:
  elias_node_modules:
